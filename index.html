<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mera Voice AI</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎙️</text></svg>">
<style>
:root {
  --bg: #f4f5fb;
  --surface: #ffffff;
  --ink: #1d1b3a;
  --muted: #6b6a85;
  --line: #e1e2f0;
  --orb-a: #5b4bff;
  --orb-b: #b24bff;
  --you: #e9e7ff;
  --ai: #ffffff;
  --danger: #d8365a;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #14132a;
    --surface: #1e1c3a;
    --ink: #eeedff;
    --muted: #9a98bd;
    --line: #2f2d52;
    --you: #2e2a63;
    --ai: #1e1c3a;
  }
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  display: flex;
  flex-direction: column;
  max-width: 640px;
  margin: 0 auto;
}
header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 14px 18px; gap: 10px;
}
header h1 { font-size: 1.05rem; margin: 0; font-weight: 700; }
.controls { display: flex; gap: 8px; align-items: center; }
select, .toggle {
  background: var(--surface); color: var(--ink);
  border: 1px solid var(--line); border-radius: 999px;
  padding: 7px 12px; font-size: .82rem; font-family: inherit;
}
.toggle { cursor: pointer; }
.toggle[aria-pressed="true"] { background: var(--orb-a); color: #fff; border-color: var(--orb-a); }

#log {
  flex: 1; overflow-y: auto; padding: 8px 18px 16px;
  display: flex; flex-direction: column; gap: 10px;
}
.empty { margin: auto; text-align: center; color: var(--muted); font-size: .95rem; line-height: 1.5; max-width: 30ch; }
.msg { max-width: 85%; padding: 10px 14px; border-radius: 16px; line-height: 1.45; font-size: .97rem; white-space: pre-wrap; }
.msg.you { align-self: flex-end; background: var(--you); border-bottom-right-radius: 4px; }
.msg.ai { align-self: flex-start; background: var(--ai); border: 1px solid var(--line); border-bottom-left-radius: 4px; }
.msg.err { align-self: center; color: var(--danger); background: transparent; text-align: center; font-size: .88rem; }

.stage { display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 8px 18px 6px; }
#status { color: var(--muted); font-size: .88rem; min-height: 1.3em; text-align: center; }

#orb {
  position: relative; width: 108px; height: 108px; border-radius: 50%; border: 0; cursor: pointer;
  background: radial-gradient(circle at 30% 25%, var(--orb-b), var(--orb-a));
  box-shadow: 0 10px 30px rgba(91, 75, 255, .4);
  display: grid; place-items: center; color: #fff;
  transition: transform .15s ease;
}
#orb:active { transform: scale(.96); }
#orb:focus-visible { outline: 3px solid var(--ink); outline-offset: 4px; }
#orb svg { width: 40px; height: 40px; }
#orb::before, #orb::after {
  content: ""; position: absolute; inset: 0; border-radius: 50%;
  border: 2px solid var(--orb-a); opacity: 0; pointer-events: none;
}
#orb.listening::before { animation: ring 1.6s ease-out infinite; }
#orb.listening::after { animation: ring 1.6s ease-out .8s infinite; }
@keyframes ring { 0% { transform: scale(1); opacity: .7; } 100% { transform: scale(1.7); opacity: 0; } }
#orb.thinking { animation: breathe 1s ease-in-out infinite; }
@keyframes breathe { 50% { transform: scale(.92); opacity: .8; } }
#orb.speaking { background: radial-gradient(circle at 30% 25%, #ff7a9a, #ff4b7a); box-shadow: 0 10px 30px rgba(255, 75, 122, .4); }
.bars { display: none; gap: 4px; align-items: center; height: 40px; }
#orb.speaking .bars { display: flex; }
#orb.speaking .mic { display: none; }
.bars i { width: 5px; background: #fff; border-radius: 3px; height: 10px; animation: bar .7s ease-in-out infinite; }
.bars i:nth-child(2) { animation-delay: .1s; } .bars i:nth-child(3) { animation-delay: .2s; }
.bars i:nth-child(4) { animation-delay: .3s; } .bars i:nth-child(5) { animation-delay: .4s; }
@keyframes bar { 50% { height: 34px; } }

form { display: flex; gap: 8px; padding: 8px 18px 16px; }
input[type=text] {
  flex: 1; min-width: 0; background: var(--surface); color: var(--ink);
  border: 1px solid var(--line); border-radius: 999px; padding: 12px 16px; font-size: 1rem; font-family: inherit;
}
input[type=text]:focus-visible { outline: 2px solid var(--orb-a); }
form button {
  background: var(--ink); color: var(--bg); border: 0; border-radius: 999px;
  padding: 0 18px; font-weight: 600; cursor: pointer; font-family: inherit;
}
@media (prefers-reduced-motion: reduce) {
  #orb, #orb::before, #orb::after, .bars i { animation: none !important; }
}
</style>
</head>
<body>
<header>
  <h1>Mera Voice AI 🎙️</h1>
  <div class="controls">
    <select id="lang" aria-label="Bolne ki bhasha">
      <option value="hi-IN">Hindi + English</option>
      <option value="en-IN">English</option>
    </select>
    <button class="toggle" id="handsfree" aria-pressed="false" title="Jawab ke baad apne aap sunna shuru kare">Hands-free</button>
  </div>
</header>

<main id="log" aria-live="polite">
  <p class="empty" id="empty">Mic dabao aur bolo, ya neeche type karo. 😎</p>
</main>

<div class="stage">
  <button id="orb" aria-label="Bolna shuru karo">
    <svg class="mic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v4"/></svg>
    <span class="bars" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></span>
  </button>
  <div id="status">Mic dabao aur bolo</div>
</div>

<form id="form" autocomplete="off">
  <input type="text" id="text" placeholder="Ya yahan type karo…" aria-label="Message">
  <button type="submit">Bhejo</button>
</form>

<script>
const $ = (id) => document.getElementById(id);
const orb = $("orb"), statusEl = $("status"), log = $("log"), langSel = $("lang"), hfBtn = $("handsfree");

let history = [];
let state = "idle";           // idle | listening | thinking | speaking
let handsFree = false;
let recognition = null;
let pendingFinal = "";

const SR = window.SpeechRecognition || window.webkitSpeechRecognition;

function setState(s, text) {
  state = s;
  orb.className = s === "idle" ? "" : s;
  statusEl.textContent = text || ({
    idle: "Mic dabao aur bolo",
    listening: "Sun raha hoon… bol bhai 👂",
    thinking: "Soch raha hoon… 🧠",
    speaking: "Bol raha hoon… (rokne ke liye mic dabao)"
  })[s];
}

function addMsg(role, text) {
  $("empty")?.remove();
  const d = document.createElement("div");
  d.className = "msg " + role;
  d.textContent = text;
  log.appendChild(d);
  log.scrollTop = log.scrollHeight;
}

/* ---------- Bolna (Text -> Voice) ---------- */
function cleanForSpeech(t) {
  return t
    .replace(/\p{Extended_Pictographic}/gu, "")
    .replace(/[*_#`>~]/g, "")
    .replace(/\s+/g, " ")
    .trim();
}

function pickVoice() {
  const voices = speechSynthesis.getVoices();
  return voices.find(v => v.lang === "en-IN") || voices.find(v => v.lang === "hi-IN") || null;
}

function speak(text) {
  const clean = cleanForSpeech(text);
  if (!clean || !("speechSynthesis" in window)) return afterSpeak();
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(clean);
  const v = pickVoice();
  if (v) { u.voice = v; u.lang = v.lang; } else { u.lang = "en-IN"; }
  u.rate = 1.02;
  u.onend = afterSpeak;
  u.onerror = afterSpeak;
  setState("speaking");
  speechSynthesis.speak(u);
}

function afterSpeak() {
  if (state !== "speaking") return;
  setState("idle");
  if (handsFree) startListening();
}

/* ---------- Sunna (Voice -> Text) ---------- */
function startListening() {
  if (!SR) return setState("idle", "Is browser mein voice nahi chalta. Chrome use kar ya type kar.");
  speechSynthesis.cancel();
  recognition = new SR();
  recognition.lang = langSel.value;
  recognition.interimResults = true;
  recognition.continuous = false;
  pendingFinal = "";

  recognition.onstart = () => setState("listening");
  recognition.onresult = (e) => {
    let interim = "";
    for (let i = e.resultIndex; i < e.results.length; i++) {
      const tr = e.results[i][0].transcript;
      if (e.results[i].isFinal) pendingFinal += tr; else interim += tr;
    }
    statusEl.textContent = (pendingFinal + interim) || "Sun raha hoon… bol bhai 👂";
  };
  recognition.onerror = (e) => {
    if (e.error === "not-allowed" || e.error === "service-not-allowed") {
      handsFree = false; hfBtn.setAttribute("aria-pressed", "false");
      setState("idle", "Mic ki permission do (address bar mein lock icon pe click kar).");
    } else if (e.error === "no-speech") {
      setState("idle", "Kuch sunai nahi diya. Mic dabake dobara bol.");
      handsFree = false; hfBtn.setAttribute("aria-pressed", "false");
    } else if (e.error !== "aborted") {
      setState("idle", "Mic mein dikkat: " + e.error);
    }
  };
  recognition.onend = () => {
    const said = pendingFinal.trim();
    if (said) send(said);
    else if (state === "listening") setState("idle");
  };
  try { recognition.start(); } catch (_) {}
}

function stopAll() {
  speechSynthesis.cancel();
  if (recognition) { try { recognition.abort(); } catch (_) {} }
  setState("idle");
}

orb.addEventListener("click", () => {
  if (state === "idle") startListening();
  else stopAll();
});

hfBtn.addEventListener("click", () => {
  handsFree = !handsFree;
  hfBtn.setAttribute("aria-pressed", String(handsFree));
  if (handsFree && state === "idle") startListening();
});

/* ---------- AI se baat ---------- */
async function send(text) {
  addMsg("you", text);
  history.push({ role: "user", content: text });
  history = history.slice(-10);
  setState("thinking");

  try {
    const passcode = localStorage.getItem("passcode") || "";
    const r = await fetch("/api/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ messages: history, passcode })
    });
    const data = await r.json().catch(() => ({}));

    if (r.status === 401) {
      const p = prompt("Passcode daal:");
      if (p) { localStorage.setItem("passcode", p); history.pop(); return send(text); }
      throw new Error("Passcode chahiye.");
    }
    if (!r.ok) throw new Error(data.error || "Kuch gadbad ho gayi.");

    history.push({ role: "assistant", content: data.reply });
    addMsg("ai", data.reply);
    speak(data.reply);
  } catch (err) {
    history.pop();
    addMsg("err", err.message);
    setState("idle");
    handsFree = false; hfBtn.setAttribute("aria-pressed", "false");
  }
}

$("form").addEventListener("submit", (e) => {
  e.preventDefault();
  const v = $("text").value.trim();
  if (!v) return;
  $("text").value = "";
  stopAll();
  send(v);
});

if ("speechSynthesis" in window) speechSynthesis.onvoiceschanged = () => {};
if (!SR) statusEl.textContent = "Voice input ke liye Chrome use kar. Type toh chalega hi.";
</script>
</body>
</html>
